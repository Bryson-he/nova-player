# Push a tag like v1.4.0 and this builds the Windows installer + portable exe
# and publishes them as a GitHub Release. Installed copies of Nova pick the
# new release up automatically through electron-updater (it reads latest.yml).
#
# The build job has read-only access and never sees a write token. Only the
# small publish job can write, and it runs in the "release" environment:
# set that environment to require your approval (Settings > Environments) so
# nothing reaches installed copies until you click Approve.
# A manual run (Actions > Release > Run workflow) only builds and uploads the
# files as a workflow artifact; it never publishes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, type check and test
        run: npm run check

      - name: Check bundled player libraries
        shell: bash
        run: |
          for f in hls.min.js jassub/jassub.js jassub/worker/worker.js jassub/wasm/jassub-worker.wasm jassub/wasm/jassub-worker-modern.wasm jassub/default.woff2; do
            test -s "src/renderer/vendor/$f" || { echo "missing vendor/$f"; exit 1; }
          done

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "package.json version ($PKG) does not match tag ($GITHUB_REF_NAME)"; exit 1
          fi

      - name: Build
        run: npm run dist

      - name: Hash
        shell: bash
        working-directory: dist
        run: sha256sum NovaPlayer-Setup.exe NovaPlayer-Portable.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nova-player
          if-no-files-found: error
          path: |
            dist/NovaPlayer-Setup.exe
            dist/NovaPlayer-Setup.exe.blockmap
            dist/NovaPlayer-Portable.exe
            dist/latest.yml
            dist/SHA256SUMS.txt

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nova-player
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/NovaPlayer-Setup.exe
            dist/NovaPlayer-Portable.exe

      # Draft first, files second, publish last: installed copies never see a
      # release whose files are still uploading.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo '### SHA-256'
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo 'Build provenance: `gh attestation verify NovaPlayer-Setup.exe --repo '"$GH_REPO"'`'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "Nova Player $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/NovaPlayer-Setup.exe dist/NovaPlayer-Setup.exe.blockmap dist/NovaPlayer-Portable.exe dist/latest.yml dist/SHA256SUMS.txt
          for f in latest.yml NovaPlayer-Setup.exe NovaPlayer-Setup.exe.blockmap NovaPlayer-Portable.exe; do
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$f" || { echo "missing $f"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
