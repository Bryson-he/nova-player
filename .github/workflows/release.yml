# Push a tag like v1.2.0 and this builds the Windows installer + portable exe
# and publishes them as a GitHub Release. Installed copies of Nova pick the
# new release up automatically through electron-updater (it reads latest.yml).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "package.json version ($PKG) does not match tag ($GITHUB_REF_NAME)"; exit 1
          fi

      # Create one draft release up front. electron-builder publishes the
      # installer and portable exe in parallel; if neither finds a release they
      # race to create two duplicates and the files get split between them.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "Nova Player $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing last means installed copies never see a release whose
      # files are still uploading.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for f in latest.yml NovaPlayer-Setup.exe NovaPlayer-Portable.exe; do
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$f" || { echo "missing $f"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
